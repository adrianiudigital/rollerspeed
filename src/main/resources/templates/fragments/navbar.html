<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark"
      th:fragment="navbar"
    >
      <div class="container">
        <a class="navbar-brand" href="/">Roller Speed</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/}">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/mission}">Misión</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/vision}">Visión</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/values}">Valores</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/services}">Servicios</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/events}">Eventos</a>
            </li>

            

            <!-- Solo ADMIN -->
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
              <a class="nav-link" th:href="@{/dashboard/admin}">Dashboard</a>
            </li>
            

            <!-- Solo INSTRUCTOR -->
            <li class="nav-item" sec:authorize="hasRole('INSTRUCTOR')">
              <a class="nav-link" th:href="@{/dashboard/instructor}">Dashboard</a>
            </li>

            <!-- Solo STUDENT -->
            <li class="nav-item" sec:authorize="hasRole('STUDENT')">
              <a class="nav-link" th:href="@{/dashboard/student}">Dashboard</a>
            </li>
          </ul>

          <ul class="navbar-nav">
            <!-- Mostrar nombre de usuario si está autenticado -->
            <li class="nav-item" sec:authorize="isAuthenticated()">
              <a
                class="nav-link disabled"
                href="#"
                th:text="'Hola, ' + ${#authentication.name}"
                >Usuario</a
              >
            </li>

            <!-- Solo cuando NO ha iniciado sesión -->
            <li class="nav-item" sec:authorize="isAnonymous()">
              <a class="nav-link" th:href="@{/login}">Login</a>
            </li>

            <!-- Mostrar Logout cuando está autenticado -->
            <li class="nav-item" sec:authorize="isAuthenticated()">
              <form th:action="@{/logout}" method="post" class="d-inline">
                <button
                  type="submit"
                  class="btn btn-link nav-link"
                  style="display: inline; padding: 0"
                >
                  Logout
                </button>
              </form>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </body>
</html>
