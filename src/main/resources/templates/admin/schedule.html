<!-- admin/schedule.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Clases</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">
    <h2 class="mb-4">Gestión de Clases</h2>

    <div class="mb-3 text-end">
        <a href="/admin/schedule/new" class="btn btn-success">+ Nueva Clase</a>
    </div>

    <div th:if="${#lists.isEmpty(classes)}" class="alert alert-warning">
        No hay clases programadas.
    </div>

    <table th:if="${not #lists.isEmpty(classes)}" class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Fecha</th>
            <th>Nivel</th>
            <th>Instructor</th>
            <th>Ubicación</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="clase : ${classes}">
            <td th:text="${#temporals.format(clase.classDate, 'yyyy-MM-dd HH:mm')}">2025-03-30</td>
            <td th:text="${clase.level}">Avanzado</td>
            <td th:text="${clase.instructorId}">1</td>
            <td th:text="${clase.trainingLocation.name}">Parque Norte</td>
            <td th:text="${clase.status}">ACTIVA</td>
            <td>
                <a th:href="@{'/admin/schedule/edit/' + ${clase.id}}" class="btn btn-sm btn-primary">Editar</a>
                <a th:href="@{'/admin/schedule/delete/' + ${clase.id}}" class="btn btn-sm btn-danger">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
