<!-- asistencia.html -->
<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <title>Registrar Asistencia</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Contenido -->
    <div class="container mt-5">
      <h2 class="mb-4">Registro de Asistencia</h2>

      <div class="alert alert-info">
        Muy pronto podrás seleccionar clases y marcar los estudiantes presentes
        o ausentes. Esta sección está en desarrollo.
      </div>

      <div class="text-center mt-5">
        <img
          src="https://cdn-icons-png.flaticon.com/512/103/103110.png"
          width="100"
          alt="Asistencia"
        />
        <p class="text-muted mt-3">Módulo de asistencia en construcción 🛠️</p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
