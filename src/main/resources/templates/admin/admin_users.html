<!-- admin_users.html -->
<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <title>Usuarios - Admin</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Mensaje de éxito -->
    <div th:if="${success}" class="alert alert-success" role="alert" id="success-alert">
      <span th:text="${success}"></span>
    </div>

    <!-- Mensaje de error -->
    <div th:if="${error}" class="alert alert-danger" role="alert" id="error-alert">
      <span th:text="${error}"></span>
    </div>

    <div class="container mt-5">
      <h2 class="mb-4">Listado de Usuarios</h2>

      <div th:if="${#lists.isEmpty(users)}" class="alert alert-warning">
        No hay usuarios registrados.
      </div>

      <table
        th:if="${not #lists.isEmpty(users)}"
        class="table table-striped table-hover shadow"
      >
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nombre de Usuario</th>
            <th>Nombre Completo</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="user : ${users}">
            <td th:text="${user.id}">1</td>
            <td th:text="${user.username}">jdoe</td>
            <td th:text="${user.fullName}">John Doe</td>
            <td th:text="${user.email}">john@example.com</td>
            <td th:text="${user.role}">ADMIN</td>
            <td th:text="${user.status}">ACTIVO</td>
          </tr>
        </tbody>
      </table>
    </div>

    <script></script>
    <script>
      var a = setTimeout(function () {
        const successAlert = document.getElementById("success-alert");
        const errorAlert = document.getElementById("error-alert");
        if (successAlert) successAlert.style.display = "none";
        if (errorAlert) errorAlert.style.display = "none";
        debugger;
      }, 4000);
    </script>
  </body>
</html>
