<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Mis Horarios</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
      <h2 class="mb-4">Mis Horarios</h2>

      <div th:if="${#lists.isEmpty(classes)}" class="alert alert-warning">
        No tienes clases asignadas por ahora.
      </div>

      <table
        th:if="${not #lists.isEmpty(classes)}"
        class="table table-striped table-hover shadow"
      >
        <thead class="table-dark">
          <tr>
            <th>Fecha</th>
            <th>Nivel</th>
            <th>Ubicación</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="clase : ${classes}">
            <td
              th:text="${#temporals.format(clase.classDate, 'yyyy-MM-dd HH:mm')}"
            >
              2025-04-01 14:00
            </td>
            <td th:text="${clase.level}">Intermedio</td>
            <td th:text="${clase.trainingLocation.name}">Polideportivo</td>
            <td th:text="${clase.status}">ACTIVE</td>
          </tr>
        </tbody>
      </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
