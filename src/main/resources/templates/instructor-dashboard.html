<!-- instructor-dashboard.html -->
<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <title>Panel de Instructor</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container mt-5">
      <div class="card shadow">
        <div class="card-body">
          <h2 class="card-title mb-4">Panel del Instructor</h2>
          <h5 class="mb-3">
            Bienvenido, <span th:text="${user.fullName}">Instructor</span>
            <small
              class="text-muted"
              th:text="'[' + ${user.username} + ']'"
            ></small>
          </h5>
          <p class="lead">
            Desde aquí puedes gestionar tus clases y asistencias:
          </p>
          <div class="row">
            <div class="col-md-6 mb-3">
              <a th:href="@{/dashboard/instructor/schedule}" class="btn btn-info w-100"
                >Ver y Modificar Horarios</a
              >
            </div>
            <div class="col-md-6 mb-3">
              <a th:href="@{/dashboard/instructor/attendance}" class="btn btn-warning w-100"
                >Registrar Asistencias</a
              >
            </div>
          </div>
          <div class="text-end mt-4">
            <form th:action="@{/logout}" method="post">
              <button class="btn btn-outline-danger">Cerrar sesión</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
